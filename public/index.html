<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图云 - 免费图片存储服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .upload-section {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e0e5ff;
            border-color: #764ba2;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upload-text {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .gallery-section {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #764ba2;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .image-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            position: relative;
            background: #f5f5f5;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
        }
        
        .image-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        
        .image-actions {
            display: flex;
            padding: 10px;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        
        .btn-download {
            background: #667eea;
            color: white;
        }
        
        .btn-download:hover {
            background: #5a67d8;
        }
        
        .btn-delete {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-delete:hover {
            background: #ff5252;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        /* URL弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #333;
        }
        
        .url-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
            color: #667eea;
            border: 1px solid #e0e0e0;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .btn-copy {
            background: #667eea;
            color: white;
        }
        
        .btn-copy:hover {
            background: #5a67d8;
        }
        
        .btn-close {
            background: #e0e0e0;
            color: #666;
        }
        
        .btn-close:hover {
            background: #d0d0d0;
        }
        
        .image-card img {
            cursor: pointer;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar.active {
            display: block;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .upload-section, .gallery-section { padding: 20px; }
            .image-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>图云</h1>
            <p class="subtitle">免费图片上传下载服务 | 支持小程序访问</p>
        </header>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">点击或拖拽上传图片</div>
                <div class="upload-hint">支持 JPG、PNG、GIF、WebP 格式，最大 10MB</div>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="gallery-section">
            <div class="section-title">
                <span>我的图片</span>
                <button class="refresh-btn" onclick="loadImages()">🔄 刷新</button>
            </div>
            <div class="image-grid" id="imageGrid">
                <div class="empty-state">
                    <div class="empty-icon">🖼️</div>
                    <p>暂无图片，快去上传吧！</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <!-- URL查看弹窗 -->
    <div class="modal" id="urlModal">
        <div class="modal-content">
            <div class="modal-title">📋 图片 URL 地址</div>
            <div class="url-box" id="urlBox"></div>
            <div class="modal-actions">
                <button class="modal-btn btn-copy" onclick="copyUrl()">📄 复制链接</button>
                <button class="modal-btn btn-close" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const imageGrid = document.getElementById('imageGrid');
        const toast = document.getElementById('toast');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const urlModal = document.getElementById('urlModal');
        const urlBox = document.getElementById('urlBox');
        
        const API_BASE = '';
        let currentImageUrl = '';
        
        // 点击上传
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
            }
        });
        
        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                uploadFiles(e.dataTransfer.files);
            }
        });
        
        // 上传文件
        async function uploadFiles(files) {
            progressBar.classList.add('active');
            progressFill.style.width = '0%';
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('image', file);
                
                try {
                    const response = await fetch(`${API_BASE}/api/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        showToast(`✅ ${file.name} 上传成功`);
                    } else {
                        showToast(`❌ ${file.name} 上传失败`);
                    }
                } catch (error) {
                    showToast(`❌ ${file.name} 上传失败: ${error.message}`);
                }
                
                progressFill.style.width = `${((i + 1) / files.length) * 100}%`;
            }
            
            setTimeout(() => {
                progressBar.classList.remove('active');
                loadImages();
            }, 500);
        }
        
        // 加载图片列表
        async function loadImages() {
            try {
                const response = await fetch(`${API_BASE}/api/images`);
                const data = await response.json();
                
                if (data.images.length === 0) {
                    imageGrid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1;">
                            <div class="empty-icon">🖼️</div>
                            <p>暂无图片，快去上传吧！</p>
                        </div>
                    `;
                    return;
                }
                
                imageGrid.innerHTML = data.images.map(img => `
                    <div class="image-card">
                        <img src="${img.url}" alt="${img.filename}" loading="lazy" onclick="showImageUrl('${img.fullUrl}')">
                        <div class="image-actions">
                            <button class="btn btn-download" onclick="showImageUrl('${img.fullUrl}')">查看URL</button>
                            <button class="btn btn-delete" onclick="deleteImage('${img.filename}')">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showToast('❌ 加载图片失败');
            }
        }
        
        // 显示图片URL
        function showImageUrl(fullUrl) {
            currentImageUrl = fullUrl;
            urlBox.textContent = fullUrl;
            urlModal.classList.add('show');
        }
        
        // 关闭弹窗
        function closeModal() {
            urlModal.classList.remove('show');
        }
        
        // 复制URL
        async function copyUrl() {
            try {
                await navigator.clipboard.writeText(currentImageUrl);
                showToast('✅ 链接已复制到剪贴板');
            } catch (err) {
                // 降级方案
                const input = document.createElement('input');
                input.value = currentImageUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('✅ 链接已复制到剪贴板');
            }
        }
        
        // 点击弹窗外部关闭
        urlModal.addEventListener('click', (e) => {
            if (e.target === urlModal) {
                closeModal();
            }
        });
        
        // 下载图片
        function downloadImage(filename) {
            window.open(`${API_BASE}/api/download/${filename}`, '_blank');
            showToast('📥 开始下载');
        }
        
        // 删除图片
        async function deleteImage(filename) {
            if (!confirm('确定要删除这张图片吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/images/${filename}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('🗑️ 删除成功');
                    loadImages();
                } else {
                    showToast('❌ 删除失败');
                }
            } catch (error) {
                showToast('❌ 删除失败');
            }
        }
        
        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // 页面加载时获取图片列表
        loadImages();
    </script>
</body>
</html>
